<meta charset="UTF-8">

name="viewport"

/>

<style>

/* =====================================================
   ASCEND MODERN DESIGN SYSTEM
===================================================== */

:root {
  --bg: #f7f8fc;
  --surface: #ffffff;
  --surface-soft: #f1f3f8;
  --border: #e5e7ef;

  --text: #172033;
  --muted: #6b7280;

  --primary: #5b5bd6;
  --primary-dark: #4545b7;
  --primary-soft: #eeeeff;

  --radius: 18px;
  --radius-lg: 24px;

  --shadow:
    0 8px 30px
    rgba(25, 32, 56, 0.08);

  --shadow-hover:
    0 15px 40px
    rgba(25, 32, 56, 0.14);
}


/* =====================================================
   GLOBAL
===================================================== */

* {
  margin: 0;
  padding: 0;

  box-sizing: border-box;

  font-family:
    Inter,
    "Segoe UI",
    Arial,
    sans-serif;
}

body {
  background: var(--bg);

  color: var(--text);

  min-height: 100vh;

  overflow-x: hidden;

  padding-bottom: 90px;
}


/* =====================================================
   TOP NAVIGATION
===================================================== */

.top-nav {
  position: sticky;

  top: 0;

  width: 100%;
  height: 64px;

  padding: 0 18px;

  display: flex;

  align-items: center;
  justify-content: space-between;

  background:
    rgba(247, 248, 252, 0.92);

  backdrop-filter:
    blur(18px);

  border-bottom:
    1px solid
    rgba(229, 231, 239, 0.8);

  z-index: 1000;
}

.brand {
  display: flex;

  align-items: center;

  gap: 10px;

  font-size: 21px;

  font-weight: 800;

  letter-spacing: 1px;
}

.brand-logo {
  width: 36px;
  height: 36px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 11px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      #8b5cf6
    );

  color: white;

  font-size: 15px;
}

.brand span {
  color: var(--text);
}

.brand strong {
  color: var(--primary);
}

.nav-buttons {
  display: flex;

  gap: 8px;
}

.nav-btn {
  width: 40px;
  height: 40px;

  border:
    1px solid
    var(--border);

  border-radius: 12px;

  background:
    var(--surface);

  color:
    var(--text);

  font-size: 15px;

  cursor: pointer;

  transition: 0.2s;
}

.nav-btn:hover {
  color: var(--primary);

  border-color:
    var(--primary);
}


/* =====================================================
   MAIN CONTAINER
===================================================== */

.main-container {
  width: 100%;

  max-width: 900px;

  margin: auto;

  padding: 20px 14px;
}


/* =====================================================
   HERO SECTION
===================================================== */

.hero {
  padding: 24px 20px;

  margin-bottom: 18px;

  border-radius:
    var(--radius-lg);

  color: white;

  background:
    linear-gradient(
      135deg,
      #1f2254,
      var(--primary),
      #7c3aed
    );

  box-shadow:
    0 15px 35px
    rgba(91, 91, 214, 0.22);

  position: relative;

  overflow: hidden;
}

.hero::after {
  content: "";

  position: absolute;

  width: 160px;
  height: 160px;

  right: -60px;
  top: -70px;

  border-radius: 50%;

  background:
    rgba(255, 255, 255, 0.1);
}

.hero-badge {
  display: inline-flex;

  align-items: center;

  gap: 6px;

  padding: 7px 11px;

  border-radius: 20px;

  background:
    rgba(255, 255, 255, 0.14);

  font-size: 11px;

  font-weight: 700;

  margin-bottom: 12px;

  position: relative;

  z-index: 2;
}

.hero h1 {
  font-size: 26px;

  margin-bottom: 8px;

  position: relative;

  z-index: 2;
}

.hero p {
  font-size: 13px;

  line-height: 1.6;

  opacity: 0.9;

  position: relative;

  z-index: 2;
}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title {
  display: flex;

  align-items: center;

  justify-content: space-between;

  margin: 22px 4px 12px;
}

.section-title h2 {
  font-size: 17px;
}

.paper-count {
  padding: 5px 10px;

  border-radius: 20px;

  background:
    var(--primary-soft);

  color:
    var(--primary);

  font-size: 11px;

  font-weight: 700;
}


/* =====================================================
   FILTER CARD
===================================================== */

.filter-card {
  padding: 14px;

  background:
    var(--surface);

  border:
    1px solid
    var(--border);

  border-radius:
    var(--radius);

  box-shadow:
    var(--shadow);
}

.filter-grid {
  display: grid;

  grid-template-columns:
    1fr;

  gap: 10px;
}

.field {
  position: relative;
}

.field i {
  position: absolute;

  left: 14px;
  top: 50%;

  transform:
    translateY(-50%);

  color:
    var(--muted);

  font-size: 14px;

  pointer-events: none;
}

.field input {
  width: 100%;
  height: 48px;

  padding:
    0 14px
    0 42px;

  border:
    1px solid
    var(--border);

  border-radius: 12px;

  background:
    var(--surface-soft);

  color:
    var(--text);

  font-size: 13px;

  outline: none;

  transition: 0.2s;
}

.field input:focus {
  background:
    white;

  border-color:
    var(--primary);

  box-shadow:
    0 0 0 3px
    rgba(91, 91, 214, 0.08);
}

.filter-actions {
  display: flex;

  gap: 10px;
}

.clear-date-btn {
  flex: 1;

  height: 48px;

  border: none;

  border-radius: 12px;

  background:
    var(--primary);

  color: white;

  font-size: 13px;

  font-weight: 700;

  cursor: pointer;

  transition: 0.2s;
}

.clear-date-btn:hover {
  background:
    var(--primary-dark);
}


/* =====================================================
   NEWSPAPER GRID
===================================================== */

.container {
  display: grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(240px, 1fr)
    );

  gap: 14px;
}


/* =====================================================
   PAPER CARD
===================================================== */

.paper-card {
  position: relative;

  display: flex;

  flex-direction: column;

  min-height: 210px;

  padding: 18px;

  text-decoration: none;

  color:
    var(--text);

  background:
    var(--surface);

  border:
    1px solid
    var(--border);

  border-radius:
    var(--radius);

  box-shadow:
    var(--shadow);

  overflow: hidden;

  transition: 0.25s;

  cursor: pointer;
}

.paper-card::before {
  content: "";

  position: absolute;

  width: 100px;
  height: 100px;

  top: -40px;
  right: -35px;

  border-radius: 50%;

  background:
    var(--primary-soft);
}

.paper-card:hover {
  transform:
    translateY(-4px);

  box-shadow:
    var(--shadow-hover);

  border-color:
    rgba(91, 91, 214, 0.35);
}

.paper-top {
  display: flex;

  align-items: center;

  justify-content: space-between;

  position: relative;

  z-index: 2;
}

.paper-icon {
  width: 52px;
  height: 52px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 16px;

  background:
    var(--primary-soft);

  color:
    var(--primary);

  font-size: 21px;
}

.paper-open {
  width: 34px;
  height: 34px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 10px;

  background:
    var(--surface-soft);

  color:
    var(--muted);

  font-size: 12px;
}

.paper-content {
  margin-top: auto;

  padding-top: 20px;

  position: relative;

  z-index: 2;
}

.paper-card h2 {
  font-size: 16px;

  line-height: 1.45;

  margin-bottom: 10px;
}

.paper-date {
  display: flex;

  align-items: center;

  gap: 7px;

  color:
    var(--muted);

  font-size: 12px;
}

.paper-date i {
  color:
    var(--primary);
}


/* =====================================================
   LOADING
===================================================== */

.loading {
  grid-column:
    1 / -1;

  padding: 55px 15px;

  text-align: center;

  color:
    var(--muted);
}

.loading i {
  display: block;

  margin-bottom: 12px;

  font-size: 30px;

  color:
    var(--primary);
}


/* =====================================================
   EMPTY STATE
===================================================== */

.empty {
  grid-column:
    1 / -1;

  padding: 50px 20px;

  text-align: center;

  background:
    var(--surface);

  border:
    1px solid
    var(--border);

  border-radius:
    var(--radius);

  color:
    var(--muted);
}

.empty i {
  display: flex;

  width: 65px;
  height: 65px;

  margin:
    0 auto 15px;

  align-items: center;
  justify-content: center;

  border-radius: 20px;

  background:
    var(--primary-soft);

  color:
    var(--primary);

  font-size: 26px;
}

.empty h3 {
  color:
    var(--text);

  margin-bottom: 7px;

  font-size: 17px;
}

.empty p {
  font-size: 13px;
}


/* =====================================================
   CTA
===================================================== */

.cta {
  margin-top: 24px;

  padding: 20px;

  text-align: center;

  background:
    var(--surface);

  border:
    1px solid
    var(--border);

  border-radius:
    var(--radius);

  box-shadow:
    var(--shadow);
}

.cta i {
  color:
    var(--primary);

  margin-bottom: 8px;

  font-size: 20px;
}

.cta h3 {
  font-size: 15px;

  margin-bottom: 5px;
}

.cta p {
  color:
    var(--muted);

  font-size: 12px;
}


/* =====================================================
   BOTTOM NAVIGATION
===================================================== */

.bottom-nav {
  position: fixed;

  left: 0;
  bottom: 0;

  width: 100%;
  height: 72px;

  display: flex;

  align-items: center;

  justify-content: space-around;

  padding:

  background:
    rgba(255, 255, 255, 0.95);

  backdrop-filter:
    blur(18px);

  border-top:
    1px solid
    var(--border);

  z-index: 2000;
}

.nav-item {
  flex: 1;

  min-width: 0;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 5px;

  padding: 7px 2px;

  text-decoration: none;

  color:
    var(--muted);

  font-size: 9px;

  font-weight: 600;

  transition: 0.2s;
}

.nav-item i {
  font-size: 17px;
}

.nav-item.active {
  color:
    var(--primary);
}

.nav-item.active i {
  width: 38px;
  height: 30px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 11px;

  background:
    var(--primary-soft);
}


/* =====================================================
   PDF VIEWER MODAL
===================================================== */

.pdf-modal {
  position: fixed;

  inset: 0;

  display: none;

  flex-direction: column;

  background:
    rgba(15, 18, 35, 0.65);

  backdrop-filter:
    blur(10px);

  z-index: 10000;

  padding: 10px;
}

.pdf-modal.active {
  display: flex;
}

.pdf-viewer-box {
  width: 100%;
  height: 100%;

  max-width: 1100px;

  margin: auto;

  display: flex;

  flex-direction: column;

  background:
    white;

  border-radius: 20px;

  overflow: hidden;

  box-shadow:
    0 20px 60px
    rgba(0, 0, 0, 0.3);
}

.pdf-viewer-header {
  min-height: 60px;

  padding: 10px 14px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  border-bottom:
    1px solid
    var(--border);
}

.pdf-viewer-title {
  display: flex;

  align-items: center;

  gap: 10px;

  font-size: 14px;

  font-weight: 700;

  overflow: hidden;
}

.pdf-viewer-title i {
  color:
    #e63946;

  font-size: 18px;
}

.pdf-viewer-title span {
  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.pdf-actions {
  display: flex;

  gap: 8px;

  flex-shrink: 0;
}

.pdf-action-btn {
  width: 38px;
  height: 38px;

  border:
    1px solid
    var(--border);

  border-radius: 10px;

  background:
    var(--surface);

  color:
    var(--text);

  display: flex;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  text-decoration: none;

  transition: 0.2s;
}

.pdf-action-btn:hover {
  background:
    var(--primary-soft);

  color:
    var(--primary);
}

.pdf-close-btn {
  background:
    var(--primary);

  color:
    white;

  border-color:
    var(--primary);
}

.pdf-close-btn:hover {
  background:
    var(--primary-dark);

  color:
    white;
}

.pdf-frame {
  width: 100%;

  flex: 1;

  min-height: 0;

  border: none;

  background:
    #f5f5f5;
}


/* =====================================================
   MOBILE PDF VIEWER
===================================================== */

@media (max-width: 600px) {

  .pdf-modal {
    padding: 0;
  }

  .pdf-viewer-box {
    border-radius: 0;
  }

  .pdf-viewer-header {
    min-height: 58px;
  }

}


/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-thumb {
  background: #c9cddd;

  border-radius: 10px;
}

</style>

</head>

     SUPABASE

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script>

/* =====================================================
   SUPABASE CONFIGURATION
===================================================== */

const SUPABASE_URL =
  "https://ndpmisgcnwtalxzlsgdh.supabase.co";


const SUPABASE_ANON_KEY =
  "sb_publishable_VA-TOQxa5NucY7L1hPStkg_3eAj42PM";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   STORE NEWSPAPER DATA
===================================================== */

let allNewspapers = [];


/* =====================================================
   START PAGE
===================================================== */

function startUserPage() {

  const today =
    new Date()
      .toISOString()
      .split("T")[0];


  document
    .getElementById(
      "dateFilter"
    )
    .value =
    today;


  loadNewspapers();

}


/* =====================================================
   LOAD NEWSPAPERS
===================================================== */

async function loadNewspapers() {

  const selectedDate =
    document
      .getElementById(
        "dateFilter"
      )
      .value;


  const container =
    document.getElementById(
      "newspaperContainer"
    );


  const count =
    document.getElementById(
      "paperCount"
    );


  container.innerHTML = `

    <div class="loading">

      <i
        class="fas fa-spinner fa-spin"
      ></i>

      <p>
        Loading newspapers...
      </p>

    </div>

  `;


  count.textContent =
    "LOADING...";


  try {


    let query =
      supabaseClient
        .from(
          "NewspaperPapers"
        )
        .select(
          "*"
        )
        .order(
          "paper_date",
          {
            ascending: false
          }
        )
        .order(
          "paper_title",
          {
            ascending: true
          }
        );


    /* FILTER BY DATE */

    if (selectedDate) {

      query =
        query.eq(
          "paper_date",
          selectedDate
        );

    }


    const {
      data,
      error
    } =
    await query;


    if (error) {

      throw error;

    }


    allNewspapers =
      data || [];


    displayNewspapers(
      allNewspapers
    );


  }

  catch (error) {


    console.error(
      error
    );


    container.innerHTML = `

      <div class="empty">

        <i
          class="fas fa-triangle-exclamation"
        ></i>

        <h3>
          Unable to Load
        </h3>

        <p>
          ${escapeHTML(
            error.message
          )}
        </p>

      </div>

    `;


    count.textContent =
      "ERROR";

  }

}


/* =====================================================
   DISPLAY NEWSPAPERS
===================================================== */

function displayNewspapers(data) {

  const container =
    document.getElementById(
      "newspaperContainer"
    );


  const count =
    document.getElementById(
      "paperCount"
    );


  container.innerHTML =
    "";


  const total =
    data ? data.length : 0;


  count.textContent =
    `${total} AVAILABLE`;


  /* NO NEWSPAPERS */

  if (
    !data ||
    data.length === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        <i
          class="fas fa-newspaper"
        ></i>

        <h3>
          No Newspapers Found
        </h3>

        <p>
          Try selecting another date
          or view all newspapers.
        </p>

      </div>

    `;

    return;

  }


  /* CREATE NEWSPAPER CARDS */

  data.forEach(
    function(paper) {


      const card =
        document.createElement(
          "a"
        );


      card.className =
        "paper-card";


      card.href =
        "#";


      card.addEventListener(
        "click",
        function(event) {


          event.preventDefault();


          openPDF(
            paper.paper_link,
            paper.paper_title
          );

        }
      );


      card.innerHTML = `

        <div class="paper-top">


          <div class="paper-icon">

            <i
              class="fas fa-newspaper"
            ></i>

          </div>


          <div class="paper-open">

            <i
              class="fas fa-arrow-up-right-from-square"
            ></i>

          </div>

        </div>


        <div class="paper-content">

          <h2>

            ${escapeHTML(
              paper.paper_title
            )}

          </h2>


          <div class="paper-date">

            <i
              class="fas fa-calendar-day"
            ></i>

            ${formatDate(
              paper.paper_date
            )}

          </div>

        </div>

      `;


      container.appendChild(
        card
      );


    }
  );

}


/* =====================================================
   SEARCH NEWSPAPER
===================================================== */

function filterByTitle() {

  const searchText =
    document
      .getElementById(
        "titleSearch"
      )
      .value
      .toLowerCase()
      .trim();


  const filteredData =
    allNewspapers.filter(
      function(paper) {


        const title =
          (
            paper.paper_title ||
            ""
          )
          .toLowerCase();


        return title.includes(
          searchText
        );


      }
    );


  displayNewspapers(
    filteredData
  );

}


/* =====================================================
   VIEW ALL NEWSPAPERS
===================================================== */

function clearDateFilter() {

  document
    .getElementById(
      "dateFilter"
    )
    .value =
    "";


  document
    .getElementById(
      "titleSearch"
    )
    .value =
    "";


  loadNewspapers();

}


/* =====================================================
   OPEN PDF IN IFRAME
===================================================== */

function openPDF(
  link,
  title
) {

  if (!link) {

    alert(
      "Newspaper link is not available."
    );

    return;

  }


  const pdfLink =
    convertGoogleDriveLink(
      link
    );


  document
    .getElementById(
      "pdfTitle"
    )
    .textContent =
    title || "Newspaper";


  document
    .getElementById(
      "pdfFrame"
    )
    .src =
    pdfLink;


  document
    .getElementById(
      "openPdfNewTab"
    )
    .href =
    pdfLink;


  document
    .getElementById(
      "pdfModal"
    )
    .classList
    .add(
      "active"
    );


  document.body.style.overflow =
    "hidden";

}


/* =====================================================
   CLOSE PDF
===================================================== */

function closePDF() {

  document
    .getElementById(
      "pdfModal"
    )
    .classList
    .remove(
      "active"
    );


  document
    .getElementById(
      "pdfFrame"
    )
    .src =
    "";


  document.body.style.overflow =
    "";

}


/* =====================================================
   GOOGLE DRIVE LINK CONVERTER
===================================================== */

function convertGoogleDriveLink(link) {

  if (!link) {

    return "#";

  }


  /*
    Supports:

    https://drive.google.com/file/d/FILE_ID/view
    https://drive.google.com/file/d/FILE_ID/edit
    https://drive.google.com/open?id=FILE_ID
  */

  const pathMatch =
    link.match(
      /\/d\/([^/?]+)/
    );


  if (
    pathMatch &&
    pathMatch[1]
  ) {

    return (
      "https://drive.google.com/file/d/" +
      pathMatch[1] +
      "/preview"
    );

  }


  const idMatch =
    link.match(
      /[?&]id=([^&]+)/
    );


  if (
    idMatch &&
    idMatch[1]
  ) {

    return (
      "https://drive.google.com/file/d/" +
      idMatch[1] +
      "/preview"
    );

  }


  return link;

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
  dateString
) {

  if (!dateString) {

    return "Date unavailable";

  }


  const date =
    new Date(
      dateString +
      "T00:00:00"
    );


  return date.toLocaleDateString(
    "en-IN",
    {

      day: "2-digit",

      month: "short",

      year: "numeric"

    }
  );

}


/* =====================================================
   SAFE HTML
===================================================== */

function escapeHTML(text) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text || "";


  return div.innerHTML;

}


/* =====================================================
   RELOAD PAGE
===================================================== */

function reloadPage() {

  location.reload();

}


/* =====================================================
   GO HOME
===================================================== */

function goHome() {

  window.location.href =
    "https://ascendlearningcommunity.github.io/ascend/index.html";

}


/* =====================================================
   CLOSE PDF ON ESCAPE
===================================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      const modal =
        document.getElementById(
          "pdfModal"
        );


      if (
        modal.classList.contains(
          "active"
        )
      ) {

        closePDF();

      }

    }

  }
);


/* =====================================================
   PAGE START
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    startUserPage();

  }
);

</script>
