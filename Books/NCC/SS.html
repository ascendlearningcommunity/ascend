<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="google-adsense-account"
        content="ca-pub-1318194885972438">

    <title>ASCEND | Learning Material</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Google Font -->
    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        /* =====================================================
           ROOT
        ===================================================== */

        :root {

            --primary: #155EEF;
            --primary-dark: #0B46C5;

            --yellow: #FFD43B;

            --bg: #F5F7FC;
            --white: #FFFFFF;

            --text: #172033;
            --muted: #68748A;

            --border: #E4E9F2;

            --blue-soft: #EDF3FF;
            --yellow-soft: #FFF8DC;

        }


        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family:
                "Inter",
                Arial,
                sans-serif;
        }


        html,
        body {
            width: 100%;
            height: 100%;
        }


        body {

            background:
                var(--bg);

            color:
                var(--text);

            overflow: hidden;
        }


        button {
            font: inherit;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            height: 76px;

            background:
                rgba(255, 255, 255, .97);

            border-bottom:
                1px solid var(--border);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            position:
                fixed;

            top: 0;
            left: 0;

            width: 100%;

            z-index: 1000;

            backdrop-filter:
                blur(16px);
        }


        .nav-container {

            width: 100%;

            max-width: 1200px;

            height: 100%;

            padding:
                0 25px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {

            display:
                flex;

            align-items:
                center;

            gap: 12px;

            text-decoration:
                none;
        }


        .logo-icon {

            width: 47px;
            height: 47px;

            border-radius:
                14px;

            background:
                var(--white);

            border:
                1px solid var(--border);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            overflow:
                hidden;
        }


        .logo-icon img {

            width: 100%;
            height: 100%;

            object-fit:
                contain;
        }


        .logo-text h1 {

            font-size:
                21px;

            font-weight:
                800;

            letter-spacing:
                1px;

            line-height:
                1;

            color:
                var(--primary);
        }


        .logo-text p {

            font-size:
                8px;

            color:
                var(--muted);

            font-weight:
                600;

            margin-top:
                5px;
        }


        /* =====================================================
           TOP BUTTONS
        ===================================================== */

        .top-actions {

            display:
                flex;

            align-items:
                center;

            gap: 10px;
        }


        .action-btn {

            width: 42px;
            height: 42px;

            border:
                1px solid var(--border);

            border-radius:
                12px;

            background:
                var(--white);

            color:
                var(--primary);

            cursor:
                pointer;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            transition:
                .2s ease;
        }


        .action-btn:hover {

            background:
                var(--blue-soft);

            border-color:
                var(--primary);
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {

            position:
                fixed;

            top:
                76px;

            bottom:
                0;

            left:
                0;

            right:
                0;

            padding:
                20px;

            display:
                flex;

            flex-direction:
                column;
        }


        /* =====================================================
           VIEWER HEADER
        ===================================================== */

        .viewer-top {

            max-width:
                1200px;

            width:
                100%;

            margin:
                0 auto 15px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                15px;
        }


        .page-title {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;
        }


        .title-icon {

            width:
                42px;

            height:
                42px;

            border-radius:
                13px;

            background:
                var(--blue-soft);

            color:
                var(--primary);

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;
        }


        .page-title h2 {

            font-size:
                17px;

            font-weight:
                800;
        }


        .page-title p {

            margin-top:
                4px;

            font-size:
                9px;

            color:
                var(--muted);
        }


        .status {

            display:
                flex;

            align-items:
                center;

            gap:
                6px;

            padding:
                8px 11px;

            border-radius:
                10px;

            background:
                var(--yellow-soft);

            color:
                #A77B00;

            font-size:
                8px;

            font-weight:
                800;
        }


        .status i {

            color:
                #DFA800;
        }


        /* =====================================================
           PDF WRAPPER
        ===================================================== */

        .viewer-container {

            width:
                100%;

            max-width:
                1200px;

            flex:
                1;

            margin:
                auto;

            background:
                var(--white);

            border:
                1px solid var(--border);

            border-radius:
                20px;

            padding:
                10px;

            overflow:
                hidden;

            box-shadow:
                0 12px 35px
                rgba(21, 94, 239, .07);
        }


        .pdf-frame {

            width:
                100%;

            height:
                100%;

            border:
                none;

            border-radius:
                13px;

            background:
                #F8F9FC;
        }


        /* =====================================================
           MOBILE BOTTOM NAV
        ===================================================== */

        .mobile-bottom-nav {

            display:
                none;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .header {

                height:
                    70px;
            }


            .nav-container {

                padding:
                    0 15px;
            }


            .logo-icon {

                width:
                    42px;

                height:
                    42px;
            }


            .logo-text h1 {

                font-size:
                    19px;
            }


            .main {

                top:
                    70px;

                bottom:
                    70px;

                padding:
                    14px;
            }


            .viewer-top {

                margin-bottom:
                    10px;
            }


            .page-title h2 {

                font-size:
                    14px;
            }


            .page-title p {

                font-size:
                    8px;
            }


            .status {

                display:
                    none;
            }


            .viewer-container {

                border-radius:
                    15px;

                padding:
                    5px;
            }


            .pdf-frame {

                border-radius:
                    11px;
            }


            /* MOBILE BOTTOM NAV */

            .mobile-bottom-nav {

                display:
                    flex;

                position:
                    fixed;

                left:
                    0;

                bottom:
                    0;

                width:
                    100%;

                height:
                    70px;

                background:
                    rgba(255, 255, 255, .97);

                backdrop-filter:
                    blur(15px);

                border-top:
                    1px solid var(--border);

                z-index:
                    2000;

                justify-content:
                    space-around;

                align-items:
                    center;
            }


            .mobile-nav-item {

                min-width:
                    50px;

                text-align:
                    center;

                color:
                    #7C879B;

                font-size:
                    8px;

                font-weight:
                    600;

                text-decoration:
                    none;
            }


            .mobile-nav-item i {

                width:
                    36px;

                height:
                    31px;

                margin:
                    auto;

                display:
                    flex;

                align-items:
                    center;

                justify-content:
                    center;

                font-size:
                    15px;
            }


            .mobile-nav-item.active {

                color:
                    var(--primary);
            }


            .mobile-nav-item.active i {

                background:
                    var(--blue-soft);

                border-radius:
                    11px;
            }
        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="nav-container">


        <!-- LOGO -->

        <a href="../index.html"
            class="logo">

            <div class="logo-icon">

                <img src="logo.png"
                    alt="ASCEND Logo">

            </div>

            <div class="logo-text">

                <h1>ASCEND</h1>

                <p>
                    Rise Today. Lead Tomorrow.
                </p>

            </div>

        </a>


        <!-- ACTION BUTTONS -->

        <div class="top-actions">

            <button class="action-btn"
                onclick="goBack()"
                title="Go Back">

                <i class="fas fa-arrow-left"></i>

            </button>


            <button class="action-btn"
                onclick="reloadPage()"
                title="Reload">

                <i class="fas fa-rotate"></i>

            </button>

        </div>


    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <!-- VIEWER TITLE -->

    <div class="viewer-top">


        <div class="page-title">

            <div class="title-icon">

                <i class="fas fa-file-pdf"></i>

            </div>


            <div>

                <h2>
                    Learning Material
                </h2>

                <p>
                    Read and explore your ASCEND study resource.
                </p>

            </div>

        </div>


        <div class="status">

            <i class="fas fa-book-open"></i>

            READ MODE

        </div>


    </div>


    <!-- PDF VIEWER -->

    <div class="viewer-container">

        <iframe
            id="pdfFrame"
            class="pdf-frame"

            src="https://drive.google.com/file/d/1iaWG9Q5cXqTglyq-lTxr_VQYgIIatAvc/preview?usp=sharing"

            sandbox="allow-same-origin allow-scripts"

            allow="fullscreen"

            frameborder="0">

        </iframe>

    </div>


</main>


<!-- =====================================================
     MOBILE BOTTOM NAV
===================================================== -->

<nav class="mobile-bottom-nav">


    <a href="../index.html"
        class="mobile-nav-item">

        <i class="fas fa-house"></i>

        Home

    </a>


    <a href="../Books.html"
        class="mobile-nav-item active">

        <i class="fas fa-book-open"></i>

        Learn

    </a>


    <a href="../Assignments.html"
        class="mobile-nav-item">

        <i class="fas fa-list-check"></i>

        Tasks

    </a>


    <a href="../Faq.html"
        class="mobile-nav-item">

        <i class="fas fa-circle-question"></i>

        FAQ

    </a>


    <a href="../Aboutus.html"
        class="mobile-nav-item">

        <i class="fas fa-users"></i>

        About

    </a>


</nav>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


    /* BACK BUTTON */

    function goBack() {

        if (
            window.history.length > 1
        ) {

            window.history.back();

        }

        else {

            window.location.href =
                "../Books.html";

        }

    }


    /* RELOAD BUTTON */

    function reloadPage() {

        window.location.reload();

    }


    /* BLOCK RIGHT CLICK */

    document.addEventListener(
        "contextmenu",
        function (event) {

            event.preventDefault();

        }
    );


    /* BLOCK COMMON SHORTCUTS */

    document.addEventListener(
        "keydown",
        function (event) {

            const ctrlOrCmd =
                event.ctrlKey ||
                event.metaKey;


            if (

                (
                    ctrlOrCmd &&
                    ["s", "p", "u"]
                    .includes(
                        event.key
                        .toLowerCase()
                    )
                )

                ||

                event.key === "F12"

            ) {

                event.preventDefault();

                event.stopPropagation();

            }

        },
        true
    );


    /* BLOCK DRAGGING */

    window.addEventListener(
        "dragstart",
        function (event) {

            event.preventDefault();

        }
    );


</script>


</body>

</html>
