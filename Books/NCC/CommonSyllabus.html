<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ASCEND | Study Viewer</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

/* =====================================================
   ASCEND DESIGN SYSTEM
===================================================== */

:root{

    --primary:#155EEF;
    --primary-dark:#0B46C5;

    --yellow:#FFD43B;

    --bg:#F5F7FC;
    --white:#FFFFFF;

    --text:#172033;
    --muted:#68748A;

    --border:#E4E9F2;

    --blue-soft:#EDF3FF;
    --yellow-soft:#FFF8DC;

    --radius:20px;

}


/* =====================================================
   RESET
===================================================== */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

    font-family:
    'Inter',
    Arial,
    sans-serif;

}


html,
body{

    width:100%;
    height:100%;

}


body{

    background:
    var(--bg);

    color:
    var(--text);

    overflow:hidden;

}


/* =====================================================
   HEADER
===================================================== */

.header{

    height:70px;

    position:fixed;

    top:0;
    left:0;

    width:100%;

    z-index:1000;

    background:
    rgba(255,255,255,.96);

    backdrop-filter:
    blur(16px);

    border-bottom:
    1px solid var(--border);

}


.nav-container{

    max-width:1200px;

    height:100%;

    margin:auto;

    padding:
    0 22px;

    display:flex;

    align-items:center;

    justify-content:space-between;

}


/* =====================================================
   LOGO
===================================================== */

.logo{

    display:flex;

    align-items:center;

    gap:10px;

    text-decoration:none;

}


.logo-icon{

    width:42px;

    height:42px;

    border-radius:13px;

    background:
    var(--white);

    border:
    1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

}


.logo-icon img{

    width:100%;

    height:100%;

    object-fit:contain;

}


.logo-icon i{

    color:
    var(--primary);

    font-size:18px;

}


.logo-text h1{

    font-size:19px;

    font-weight:800;

    letter-spacing:1px;

    color:
    var(--primary);

    line-height:1;

}


.logo-text p{

    font-size:7px;

    font-weight:600;

    color:
    var(--muted);

    margin-top:5px;

}


/* =====================================================
   HEADER ACTIONS
===================================================== */

.header-actions{

    display:flex;

    align-items:center;

    gap:9px;

}


.icon-btn{

    width:40px;

    height:40px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
    var(--blue-soft);

    color:
    var(--primary);

    font-size:15px;

    transition:.2s;

}


.icon-btn:hover{

    background:
    var(--primary);

    color:
    #fff;

}


.icon-btn.back{

    background:
    var(--yellow-soft);

    color:
    #A77B00;

}


.icon-btn.back:hover{

    background:
    var(--yellow);

    color:
    #403500;

}


/* =====================================================
   VIEWER PAGE
===================================================== */

.viewer-page{

    position:fixed;

    top:70px;

    bottom:0;

    left:0;

    width:100%;

    display:flex;

    flex-direction:column;

}


/* =====================================================
   STUDY BAR
===================================================== */

.study-bar{

    background:
    rgba(255,255,255,.96);

    border-bottom:
    1px solid var(--border);

    padding:
    11px 22px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

}


.study-info{

    display:flex;

    align-items:center;

    gap:10px;

}


.study-icon{

    width:35px;

    height:35px;

    border-radius:11px;

    background:
    var(--blue-soft);

    color:
    var(--primary);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:14px;

}


.study-title h2{

    font-size:13px;

    font-weight:700;

}


.study-title p{

    font-size:8px;

    color:
    var(--muted);

    margin-top:3px;

}


.study-status{

    display:flex;

    align-items:center;

    gap:6px;

    padding:
    7px 10px;

    border-radius:10px;

    background:
    #EAFBF3;

    color:
    #18A66A;

    font-size:8px;

    font-weight:700;

}


.status-dot{

    width:6px;

    height:6px;

    border-radius:50%;

    background:
    #18A66A;

}


/* =====================================================
   PDF VIEWER
===================================================== */

.viewer-wrap{

    flex:1;

    padding:
    18px;

    background:
    #EEF2F9;

    display:flex;

    justify-content:center;

    align-items:stretch;

    overflow:hidden;

}


.pdf-container{

    width:100%;

    max-width:1100px;

    height:100%;

    background:
    #fff;

    border:
    1px solid var(--border);

    border-radius:
    20px;

    overflow:hidden;

    box-shadow:
    0 12px 35px
    rgba(21,94,239,.08);

}


.pdf-frame{

    width:100%;

    height:100%;

    border:none;

}


/* =====================================================
   MOBILE BOTTOM NAV
===================================================== */

.mobile-bottom-nav{

    display:none;

}


/* =====================================================
   DESKTOP FOOTER BAR
===================================================== */

.viewer-footer{

    height:40px;

    background:#fff;

    border-top:
    1px solid var(--border);

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    font-size:8px;

    color:
    var(--muted);

}


.viewer-footer strong{

    color:
    var(--primary);

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .header{

        height:64px;

    }


    .nav-container{

        padding:
        0 14px;

    }


    .viewer-page{

        top:64px;

        bottom:70px;

    }


    .logo-icon{

        width:39px;

        height:39px;

    }


    .logo-text h1{

        font-size:17px;

    }


    .logo-text p{

        font-size:6px;

    }


    .icon-btn{

        width:38px;

        height:38px;

    }


    .study-bar{

        padding:
        10px 14px;

    }


    .study-status{

        display:none;

    }


    .study-title h2{

        font-size:11px;

    }


    .study-title p{

        font-size:7px;

    }


    .viewer-wrap{

        padding:
        8px;

    }


    .pdf-container{

        border-radius:
        14px;

    }


    .viewer-footer{

        display:none;

    }


    /* MOBILE BOTTOM NAV */

    .mobile-bottom-nav{

        display:flex;

        position:fixed;

        left:0;

        bottom:0;

        width:100%;

        height:70px;

        background:
        rgba(255,255,255,.97);

        backdrop-filter:
        blur(15px);

        border-top:
        1px solid var(--border);

        z-index:2000;

        justify-content:
        space-around;

        align-items:center;

    }


    .mobile-nav-item{

        min-width:50px;

        text-align:center;

        color:
        #7C879B;

        font-size:8px;

        font-weight:600;

        text-decoration:none;

    }


    .mobile-nav-item i{

        width:36px;

        height:31px;

        margin:auto;

        display:flex;

        align-items:center;

        justify-content:center;

        font-size:15px;

    }


    .mobile-nav-item.active{

        color:
        var(--primary);

    }


    .mobile-nav-item.active i{

        background:
        var(--blue-soft);

        border-radius:
        11px;

    }

}

</style>

</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

<div class="nav-container">

<a href="../index.html"
class="logo">


<div class="logo-icon">

    <!-- Replace with your ASCEND logo if needed -->

    <img
    src="../logo.png"
    alt="ASCEND Logo"
    onerror="this.style.display='none';
    this.parentElement.innerHTML='<i class=\'fas fa-arrow-trend-up\'></i>'">

</div>


<div class="logo-text">

    <h1>ASCEND</h1>

    <p>
        Rise Today. Lead Tomorrow.
    </p>

</div>


</a>

<div class="header-actions">


<button
class="icon-btn back"
onclick="goBack()"
title="Go Back">

    <i class="fas fa-arrow-left"></i>

</button>


<button
class="icon-btn"
onclick="reloadPage()"
title="Reload">

    <i class="fas fa-rotate"></i>

</button>


</div>

</div>

</header>

<!-- =====================================================
     PDF VIEWER
===================================================== -->

<main class="viewer-page">

<!-- STUDY INFORMATION BAR -->

<div class="study-bar">


<div class="study-info">


    <div class="study-icon">

        <i class="fas fa-book-open"></i>

    </div>


    <div class="study-title">

        <h2>
            Study Material
        </h2>

        <p>
            ASCEND Learning Resource
        </p>

    </div>


</div>


<div class="study-status">

    <span class="status-dot"></span>

    Ready to Learn

</div>


</div>

<!-- PDF -->

<div class="viewer-wrap">


<div class="pdf-container">


    <iframe

    id="pdfFrame"

    class="pdf-frame"

    src="https://drive.google.com/file/d/1OYX2rrWQU99mhcFntcAUXStwdSMhTggb/preview?usp=sharing"

    sandbox="allow-same-origin allow-scripts"

    allow="fullscreen"

    frameborder="0">

    </iframe>


</div>


</div>

<!-- DESKTOP FOOTER -->

<div class="viewer-footer">


<strong>ASCEND</strong>

•

Rise Today. Lead Tomorrow.


</div>

</main>

<!-- =====================================================
     MOBILE BOTTOM NAV
===================================================== -->

<nav class="mobile-bottom-nav">


<a
href="../index.html"
class="mobile-nav-item">

    <i class="fas fa-house"></i>

    Home

</a>



<a
href="../Books.html"
class="mobile-nav-item active">

    <i class="fas fa-book-open"></i>

    Learn

</a>



<a
href="../Assignments.html"
class="mobile-nav-item">

    <i class="fas fa-list-check"></i>

    Tasks

</a>



<a
href="../Faq.html"
class="mobile-nav-item">

    <i class="fas fa-circle-question"></i>

    FAQ

</a>



<a
href="../Aboutus.html"
class="mobile-nav-item">

    <i class="fas fa-users"></i>

    About

</a>


</nav>

<script>


/* =====================================================
   GO BACK
===================================================== */

function goBack(){

    if(
        document.referrer &&
        history.length > 1
    ){

        history.back();

    }

    else{

        window.location.href =
        "../Books.html";

    }

}



/* =====================================================
   RELOAD PAGE
===================================================== */

function reloadPage(){

    location.reload();

}

</script>

</body>

</html>
