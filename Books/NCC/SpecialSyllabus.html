<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASCEND | PDF Viewer</title>

  <!-- Font Awesome -->

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Google Font -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

  <style>

    /* =====================================================
       ROOT
    ===================================================== */

    :root{
      --primary:#155EEF;
      --primary-dark:#0B46C5;

      --yellow:#FFD43B;

      --bg:#F5F7FC;
      --white:#FFFFFF;

      --text:#172033;
      --muted:#68748A;

      --border:#E4E9F2;

      --blue-soft:#EDF3FF;

      --radius:20px;
    }


    /* =====================================================
       RESET
    ===================================================== */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;

      font-family:
      'Inter',
      Arial,
      sans-serif;
    }


    html,
    body{
      width:100%;
      height:100%;
      overflow:hidden;

      background:
      var(--bg);

      color:
      var(--text);
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .header{
      height:76px;

      background:
      rgba(255,255,255,.96);

      border-bottom:
      1px solid var(--border);

      position:fixed;

      top:0;
      left:0;

      width:100%;

      z-index:1000;

      backdrop-filter:
      blur(16px);
    }


    .nav-container{
      max-width:1200px;

      height:100%;

      margin:auto;

      padding:
      0 25px;

      display:flex;

      align-items:center;

      justify-content:
      space-between;
    }


    /* =====================================================
       LOGO
    ===================================================== */

    .logo{
      display:flex;

      align-items:center;

      gap:12px;

      text-decoration:none;
    }


    .logo-icon{
      width:47px;
      height:47px;

      border-radius:
      14px;

      background:
      var(--white);

      border:
      1px solid var(--border);

      display:flex;

      align-items:center;

      justify-content:center;

      overflow:hidden;
    }


    .logo-icon img{
      width:100%;
      height:100%;

      object-fit:
      contain;
    }


    .logo-text h1{
      font-size:21px;

      font-weight:800;

      letter-spacing:
      1px;

      line-height:1;

      color:
      var(--primary);
    }


    .logo-text p{
      font-size:8px;

      color:
      var(--muted);

      font-weight:600;

      margin-top:5px;
    }


    /* =====================================================
       HEADER ACTIONS
    ===================================================== */

    .header-actions{
      display:flex;

      align-items:center;

      gap:10px;
    }


    .icon-btn{
      width:42px;
      height:42px;

      border:none;

      border-radius:
      12px;

      background:
      var(--blue-soft);

      color:
      var(--primary);

      cursor:pointer;

      display:flex;

      align-items:center;

      justify-content:center;

      font-size:16px;

      transition:
      .2s ease;
    }


    .icon-btn:hover{
      transform:
      translateY(-2px);

      background:
      var(--primary);

      color:#fff;
    }


    /* =====================================================
       MAIN VIEWER AREA
    ===================================================== */

    .viewer-page{
      position:fixed;

      top:76px;
      bottom:0;

      left:0;
      right:0;

      padding:
      22px;

      display:flex;

      flex-direction:
      column;

      gap:15px;

      overflow:hidden;
    }


    /* =====================================================
       VIEWER TOP BAR
    ===================================================== */

    .viewer-toolbar{
      max-width:1200px;

      width:100%;

      margin:auto;

      display:flex;

      align-items:center;

      justify-content:
      space-between;

      gap:15px;
    }


    .document-info{
      display:flex;

      align-items:center;

      gap:11px;

      min-width:0;
    }


    .document-icon{
      width:45px;
      height:45px;

      flex-shrink:0;

      border-radius:
      14px;

      background:
      var(--blue-soft);

      color:
      var(--primary);

      display:flex;

      align-items:center;

      justify-content:center;

      font-size:18px;
    }


    .document-info h2{
      font-size:15px;

      font-weight:800;

      white-space:nowrap;

      overflow:hidden;

      text-overflow:
      ellipsis;
    }


    .document-info p{
      font-size:9px;

      color:
      var(--muted);

      margin-top:4px;
    }


    .secure-badge{
      display:flex;

      align-items:center;

      gap:7px;

      padding:
      8px 12px;

      border-radius:
      12px;

      background:
      #EAFBF3;

      color:
      #18A66A;

      font-size:9px;

      font-weight:800;

      white-space:nowrap;
    }


    /* =====================================================
       PDF VIEWER
    ===================================================== */

    .viewer-card{
      width:100%;

      max-width:1200px;

      margin:auto;

      flex:1;

      min-height:0;

      background:
      var(--white);

      border:
      1px solid var(--border);

      border-radius:
      22px;

      padding:
      8px;

      overflow:hidden;

      box-shadow:
      0 15px 40px
      rgba(21,94,239,.07);
    }


    .pdf-frame{
      width:100%;
      height:100%;

      border:none;

      border-radius:
      15px;

      background:#fff;
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .viewer-footer{
      max-width:1200px;

      width:100%;

      margin:auto;

      display:flex;

      justify-content:
      space-between;

      align-items:center;

      gap:10px;

      color:
      var(--muted);

      font-size:9px;

      padding:
      0 4px;
    }


    .viewer-footer strong{
      color:
      var(--primary);
    }


    /* =====================================================
       MOBILE BOTTOM NAV
    ===================================================== */

    .mobile-bottom-nav{
      display:none;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media(max-width:700px){

      .header{
        height:70px;
      }


      .nav-container{
        padding:
        0 14px;
      }


      .logo-icon{
        width:42px;
        height:42px;
      }


      .logo-text h1{
        font-size:19px;
      }


      .header-actions{
        gap:7px;
      }


      .icon-btn{
        width:39px;
        height:39px;

        border-radius:
        11px;
      }


      .viewer-page{
        top:70px;

        bottom:70px;

        padding:
        13px;

        gap:12px;
      }


      .viewer-toolbar{
        align-items:
        center;
      }


      .document-icon{
        width:41px;
        height:41px;

        border-radius:
        12px;

        font-size:16px;
      }


      .document-info h2{
        font-size:12px;
      }


      .document-info p{
        font-size:8px;
      }


      .secure-badge{
        display:none;
      }


      .viewer-card{
        border-radius:
        17px;

        padding:
        5px;
      }


      .pdf-frame{
        border-radius:
        13px;
      }


      .viewer-footer{
        display:none;
      }


      /* MOBILE BOTTOM NAV */

      .mobile-bottom-nav{
        display:flex;

        position:fixed;

        left:0;
        bottom:0;

        width:100%;
        height:70px;

        background:
        rgba(255,255,255,.97);

        backdrop-filter:
        blur(15px);

        border-top:
        1px solid var(--border);

        z-index:2000;

        justify-content:
        space-around;

        align-items:center;
      }


      .mobile-nav-item{
        min-width:50px;

        text-align:center;

        color:
        #7C879B;

        font-size:8px;

        font-weight:600;

        text-decoration:none;
      }


      .mobile-nav-item i{
        width:36px;
        height:31px;

        margin:auto;

        display:flex;

        align-items:center;

        justify-content:center;

        font-size:15px;
      }


      .mobile-nav-item.active{
        color:
        var(--primary);
      }


      .mobile-nav-item.active i{
        background:
        var(--blue-soft);

        border-radius:
        11px;
      }

    }


    /* =====================================================
       SMALL MOBILE
    ===================================================== */

    @media(max-width:380px){

      .logo-text p{
        display:none;
      }


      .viewer-page{
        padding:
        10px;
      }


      .document-info h2{
        font-size:11px;
      }

    }

  </style>

</head>

<body>

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">


<div class="nav-container">


  <!-- LOGO -->

  <a href="../../index.html"
     class="logo">

    <div class="logo-icon">

      <img
        src="../../logo.png"
        alt="ASCEND Logo">

    </div>


    <div class="logo-text">

      <h1>ASCEND</h1>

      <p>
        Rise Today. Lead Tomorrow.
      </p>

    </div>

  </a>


  <!-- ACTIONS -->

  <div class="header-actions">

    <button
      class="icon-btn"
      id="backBtn"
      onclick="goBack()"
      title="Go Back">

      <i class="fas fa-arrow-left"></i>

    </button>


    <button
      class="icon-btn"
      id="reloadBtn"
      onclick="reloadPage()"
      title="Reload Document">

      <i class="fas fa-rotate"></i>

    </button>

  </div>


</div>


  </header>

  <!-- =====================================================
       PDF VIEWER
  ====================================================== -->

  <main class="viewer-page">


<!-- DOCUMENT INFO -->

<div class="viewer-toolbar">


  <div class="document-info">

    <div class="document-icon">

      <i class="fas fa-file-pdf"></i>

    </div>


    <div>

      <h2>
        ASCEND Learning Material
      </h2>

      <p>
        Read and learn at your own pace
      </p>

    </div>

  </div>


  <div class="secure-badge">

    <i class="fas fa-shield-halved"></i>

    Secure Viewer

  </div>


</div>


<!-- PDF -->

<section class="viewer-card">

  <iframe
    id="pdfFrame"
    class="pdf-frame"
    src="https://drive.google.com/file/d/1RGqww-ssdcmqdwImgaJj0lVmiDh2fLbY/preview?usp=sharing"
    sandbox="allow-same-origin allow-scripts"
    allow="fullscreen"
    frameborder="0">

  </iframe>

</section>


<!-- DESKTOP FOOTER -->

<div class="viewer-footer">

  <span>
    <strong>ASCEND</strong>
    • Learning & Growth Community
  </span>


  <span>
    Rise Today. Lead Tomorrow.
  </span>

</div>


  </main>

  <!-- =====================================================
       MOBILE BOTTOM NAV
  ====================================================== -->

  <nav class="mobile-bottom-nav">


<a
  href="../../index.html"
  class="mobile-nav-item">

  <i class="fas fa-house"></i>

  Home

</a>


<a
  href="../../Books.html"
  class="mobile-nav-item active">

  <i class="fas fa-book-open"></i>

  Learn

</a>


<a
  href="../../Assignments.html"
  class="mobile-nav-item">

  <i class="fas fa-list-check"></i>

  Tasks

</a>


<a
  href="../../Faq.html"
  class="mobile-nav-item">

  <i class="fas fa-circle-question"></i>

  FAQ

</a>


<a
  href="../../Aboutus.html"
  class="mobile-nav-item">

  <i class="fas fa-users"></i>

  About

</a>


  </nav>

  <script>

    /* =====================================================
       BACK
    ====================================================== */

    function goBack(){

      const backBtn =
      document.getElementById("backBtn");


      backBtn.style.transform =
      "scale(.92)";


      setTimeout(() => {

        backBtn.style.transform =
        "";

      }, 150);


      if(window.history.length > 1){

        history.back();

      }

      else{

        window.location.href =
        "../../Books.html";

      }

    }


    /* =====================================================
       RELOAD
    ====================================================== */

    function reloadPage(){

      const reloadBtn =
      document.getElementById("reloadBtn");


      reloadBtn.style.transform =
      "rotate(180deg)";


      setTimeout(() => {

        location.reload();

      }, 250);

    }


    /* =====================================================
       BASIC CONTENT PROTECTION
    ====================================================== */

    document.addEventListener(
      "contextmenu",
      function(e){

        e.preventDefault();

      }
    );


    document.addEventListener(
      "keydown",
      function(e){

        const ctrlOrCmd =
        e.ctrlKey || e.metaKey;


        if(

          (
            ctrlOrCmd &&
            ["s","p","u"]
            .includes(
              e.key.toLowerCase()
            )
          )

          ||

          e.key === "F12"

        ){

          e.preventDefault();

          e.stopPropagation();

        }

      },
      true
    );


    window.addEventListener(
      "dragstart",
      e => e.preventDefault()
    );

  </script>

</body>
</html>
