<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">

  <title>ASCEND | Study Viewer</title>

  <!-- Font Awesome -->

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-soft: #f8f9fc;
      --text: #101828;
      --muted: #667085;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #7c3aed;
      --shadow: 0 10px 35px rgba(16, 24, 40, 0.10);
      --radius: 18px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* =========================
       ASCEND APPLICATION SHELL
    ========================= */

    .app {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(
          circle at top right,
          rgba(124, 58, 237, 0.08),
          transparent 30%
        ),
        var(--bg);
    }

    /* =========================
       TOP HEADER
    ========================= */

    .top-nav {
      height: 70px;
      min-height: 70px;
      padding: 0 18px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: space-between;

      position: relative;
      z-index: 100;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(
        135deg,
        var(--primary),
        var(--accent)
      );

      display: flex;
      align-items: center;
      justify-content: center;

      color: #ffffff;
      font-size: 18px;

      box-shadow:
        0 8px 20px rgba(37, 99, 235, 0.25);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .brand-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text);
      line-height: 1;
    }

    .brand-subtitle {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;

      border: 1px solid var(--border);
      background: var(--surface);

      color: var(--muted);
      font-size: 16px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        transform 0.2s,
        background 0.2s,
        color 0.2s,
        border-color 0.2s;
    }

    .action-btn:hover {
      background: #eef2ff;
      color: var(--primary);
      border-color: #c7d2fe;
    }

    .action-btn:active {
      transform: scale(0.92);
    }

    /* =========================
       VIEWER AREA
    ========================= */

    .viewer-area {
      flex: 1;
      min-height: 0;
      padding: 16px;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    .viewer-info {
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 0 2px 14px;
    }

    .document-icon {
      width: 40px;
      height: 40px;
      border-radius: 13px;

      background: #eef2ff;
      color: var(--primary);

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 16px;
    }

    .document-text {
      flex: 1;
      min-width: 0;
    }

    .document-title {
      font-size: 14px;
      font-weight: 750;
      color: var(--text);
    }

    .document-status {
      margin-top: 3px;

      font-size: 11px;
      color: var(--muted);

      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
    }

    /* =========================
       PDF CARD
    ========================= */

    .pdf-container {
      flex: 1;
      min-height: 0;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);

      padding: 5px;

      overflow: hidden;

      box-shadow: var(--shadow);
    }

    .pdf-frame {
      width: 100%;
      height: 100%;

      border: none;
      border-radius: calc(var(--radius) - 6px);

      background: #ffffff;
    }

    /* =========================
       LOADING SCREEN
    ========================= */

    .loader {
      position: absolute;
      inset: 0;

      background: rgba(244, 246, 251, 0.96);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 16px;

      z-index: 50;

      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
    }

    .loader.hide {
      opacity: 0;
      visibility: hidden;
    }

    .loader-spinner {
      width: 42px;
      height: 42px;

      border: 4px solid #dbeafe;
      border-top-color: var(--primary);

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    .loader-text {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 480px) {
      .top-nav {
        height: 64px;
        min-height: 64px;
        padding: 0 14px;
      }

      .brand-icon {
        width: 38px;
        height: 38px;
        border-radius: 12px;
      }

      .brand-name {
        font-size: 18px;
      }

      .viewer-area {
        padding: 10px;
      }

      .viewer-info {
        padding-bottom: 10px;
      }

      .pdf-container {
        border-radius: 15px;
      }
    }
  </style>

</head>

<body>

  <div class="app">


<!-- ================= HEADER ================= -->

<header class="top-nav">

  <div class="brand-area">

    <div class="brand-icon">
      <i class="fa-solid fa-arrow-trend-up"></i>
    </div>

    <div class="brand-text">
      <div class="brand-name">ASCEND</div>
      <div class="brand-subtitle">Learn • Grow • Achieve</div>
    </div>

  </div>

  <div class="top-actions">

    <button
      class="action-btn"
      onclick="goBack()"
      title="Go Back"
      aria-label="Go Back">

      <i class="fa-solid fa-arrow-left"></i>

    </button>

    <button
      class="action-btn"
      onclick="reloadPage()"
      title="Reload"
      aria-label="Reload">

      <i class="fa-solid fa-rotate-right"></i>

    </button>

  </div>

</header>


<!-- ================= PDF VIEWER ================= -->

<main class="viewer-area">

  <div class="viewer-info">

    <div class="document-icon">
      <i class="fa-solid fa-file-pdf"></i>
    </div>

    <div class="document-text">

      <div class="document-title">
        Study Material
      </div>

      <div class="document-status">

        <span class="status-dot"></span>

        <span>Secure document viewer</span>

      </div>

    </div>

  </div>


  <div class="pdf-container">

    <iframe
      id="pdfFrame"
      class="pdf-frame"

      src="https://drive.google.com/file/d/1g-LsCB22dMyN6VOTClK9iE9FbvmVT0D9/preview?usp=sharing"

      sandbox="allow-same-origin allow-scripts"

      allow="fullscreen"

      frameborder="0"

      scrolling="auto">

    </iframe>

  </div>

</main>


  </div>

  <!-- Loading Screen -->

  <div class="loader" id="loader">


<div class="loader-spinner"></div>

<div class="loader-text">
  Loading study material...
</div>


  </div>

  <script>

    /* =========================
       NAVIGATION
    ========================= */

    function goBack() {

      if (window.history.length > 1) {

        history.back();

      } else {

        window.location.href = "../Books.html";

      }

    }


    function reloadPage() {

      location.reload();

    }


    /* =========================
       PDF LOADING
    ========================= */

    const pdfFrame = document.getElementById("pdfFrame");
    const loader = document.getElementById("loader");

    pdfFrame.addEventListener("load", function () {

      loader.classList.add("hide");

    });


    /* =========================
       BASIC UI PROTECTION
    ========================= */

    document.addEventListener("contextmenu", function (event) {

      event.preventDefault();

    });


    document.addEventListener(
      "keydown",
      function (event) {

        const ctrlOrCmd = event.ctrlKey || event.metaKey;

        const key = event.key.toLowerCase();

        if (

          (ctrlOrCmd && ["s", "p", "u"].includes(key))

          ||

          event.key === "F12"

          ||

          (event.ctrlKey && event.shiftKey && ["i", "j", "c"].includes(key))

        ) {

          event.preventDefault();

          event.stopPropagation();

        }

      },

      true

    );


    window.addEventListener(
      "dragstart",
      function (event) {

        event.preventDefault();

      }

    );

  </script>

</body>
</html>
