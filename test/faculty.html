<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASCEND | Faculty Questions</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Excel Library -->

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
:root{
  --primary:#5b5bd6;
  --primary-dark:#4646bd;
  --primary-soft:#eeeeff;
  --secondary:#7c3aed;
  --bg:#f7f8fc;
  --surface:#ffffff;
  --border:#e8e9f0;
  --text:#1c1c28;
  --muted:#747488;
  --danger:#ef4444;
  --danger-soft:#fff1f1;
  --success:#16a34a;
  --radius:18px;
  --nav-height:70px;
  --bottom-height:68px;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",Arial,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:90px;
}

/* ===============================
   TOP NAVIGATION
================================ */

.top-nav{
  height:var(--nav-height);
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
  backdrop-filter:blur(12px);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:22px;
  font-weight:800;
  letter-spacing:-.5px;
}

.brand-logo{
  width:40px;
  height:40px;
  border-radius:13px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  box-shadow:0 8px 20px rgba(91,91,214,.25);
}

.brand span{
  color:var(--text);
}

.brand strong{
  color:var(--primary);
}

.nav-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:13px;
  background:#f4f5f9;
  color:var(--muted);
  cursor:pointer;
  font-size:16px;
  transition:.25s;
}

.icon-btn:hover{
  background:var(--primary-soft);
  color:var(--primary);
  transform:rotate(30deg);
}

/* ===============================
   MAIN
================================ */

.page-content{
  max-width:1200px;
  margin:0 auto;
  padding:100px 22px 30px;
}

/* HERO */

.dashboard-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:26px;
  flex-wrap:wrap;
}

.title-area h1{
  font-size:30px;
  font-weight:800;
  letter-spacing:-1px;
  margin-bottom:7px;
}

.title-area p{
  color:var(--muted);
  font-size:14px;
}

.question-count{
  padding:10px 15px;
  border-radius:14px;
  background:var(--primary-soft);
  color:var(--primary);
  font-size:13px;
  font-weight:700;
}

/* ===============================
   TOOLBAR
================================ */

.toolbar{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:20px;
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  box-shadow:0 4px 20px rgba(30,30,60,.03);
}

.select-wrap{
  position:relative;
}

.select-wrap i{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  pointer-events:none;
}

.select-input{
  height:44px;
  min-width:175px;
  padding:0 15px 0 38px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fafbfe;
  color:var(--text);
  outline:none;
  cursor:pointer;
}

.select-input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft);
}

.toolbar-spacer{
  flex:1;
}

.btn{
  height:44px;
  border:none;
  border-radius:12px;
  padding:0 17px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
  transition:.25s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:var(--primary);
  color:#fff;
  box-shadow:0 8px 18px rgba(91,91,214,.22);
}

.btn-primary:hover{
  background:var(--primary-dark);
}

.btn-light{
  background:#f4f5f9;
  color:#555569;
}

.btn-light:hover{
  background:var(--primary-soft);
  color:var(--primary);
}

.btn-danger{
  background:var(--danger-soft);
  color:var(--danger);
}

.btn-danger:hover{
  background:var(--danger);
  color:#fff;
}

/* ===============================
   QUESTION LIST
================================ */

.question-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.question-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  display:flex;
  gap:18px;
  align-items:center;
  transition:.25s;
  box-shadow:0 3px 15px rgba(30,30,60,.025);
}

.question-card:hover{
  border-color:#d6d6f4;
  transform:translateY(-2px);
  box-shadow:0 10px 28px rgba(50,50,100,.07);
}

.question-check{
  width:20px;
  height:20px;
  accent-color:var(--primary);
  cursor:pointer;
  flex-shrink:0;
}

.question-number{
  width:42px;
  height:42px;
  border-radius:13px;
  background:var(--primary-soft);
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:14px;
  flex-shrink:0;
}

.question-main{
  flex:1;
  min-width:0;
}

.question-top{
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:7px;
  flex-wrap:wrap;
}

.year-badge{
  background:#f4f5f9;
  color:#626277;
  border-radius:20px;
  padding:5px 10px;
  font-size:11px;
  font-weight:700;
}

.answer-badge{
  background:#ecfdf3;
  color:var(--success);
  border-radius:20px;
  padding:5px 10px;
  font-size:11px;
  font-weight:700;
}

.question-text{
  font-size:15px;
  font-weight:650;
  line-height:1.5;
}

.question-actions{
  display:flex;
  gap:8px;
  flex-shrink:0;
}

.action-icon{
  width:38px;
  height:38px;
  border-radius:11px;
  border:1px solid var(--border);
  background:#fff;
  color:var(--muted);
  cursor:pointer;
  transition:.2s;
}

.action-icon:hover{
  color:var(--primary);
  background:var(--primary-soft);
  border-color:var(--primary-soft);
}

.action-icon.delete:hover{
  color:var(--danger);
  background:var(--danger-soft);
  border-color:var(--danger-soft);
}

/* ===============================
   EMPTY / LOADING
================================ */

.empty-state{
  background:#fff;
  border:1px dashed #d8d9e2;
  border-radius:var(--radius);
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}

.empty-state i{
  font-size:38px;
  color:#c7c8d8;
  margin-bottom:14px;
}

.empty-state h3{
  color:var(--text);
  margin-bottom:7px;
}

.loading{
  text-align:center;
  padding:45px;
  color:var(--muted);
}

.loading i{
  color:var(--primary);
  font-size:28px;
}

/* ===============================
   DRAWER OVERLAY
================================ */

.drawer-overlay{
  position:fixed;
  inset:0;
  background:rgba(15,15,35,.32);
  opacity:0;
  visibility:hidden;
  transition:.3s;
  z-index:1999;
  backdrop-filter:blur(2px);
}

.drawer-overlay.open{
  opacity:1;
  visibility:visible;
}

.drawer{
  position:fixed;
  top:0;
  right:-500px;
  width:500px;
  max-width:100%;
  height:100vh;
  background:#fff;
  z-index:2000;
  transition:.35s cubic-bezier(.2,.8,.2,1);
  box-shadow:-15px 0 40px rgba(0,0,0,.12);
  display:flex;
  flex-direction:column;
}

.drawer.open{
  right:0;
}

.drawer-header{
  height:76px;
  padding:0 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.drawer-title{
  display:flex;
  align-items:center;
  gap:12px;
}

.drawer-title-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  background:var(--primary-soft);
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
}

.drawer-title h2{
  font-size:19px;
}

.drawer-title p{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.close-btn{
  width:38px;
  height:38px;
  border:none;
  background:#f5f5f8;
  border-radius:12px;
  cursor:pointer;
  color:var(--muted);
}

.drawer-content{
  flex:1;
  overflow-y:auto;
  padding:22px;
}

.form-group{
  margin-bottom:18px;
}

.form-label{
  display:block;
  font-size:12px;
  color:#5f6074;
  font-weight:700;
  margin-bottom:7px;
}

.form-control{
  width:100%;
  min-height:45px;
  padding:11px 13px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
  color:var(--text);
  outline:none;
  font-size:14px;
  transition:.2s;
}

.form-control:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft);
}

textarea.form-control{
  min-height:105px;
  resize:vertical;
}

.options-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.drawer-footer{
  padding:16px 22px;
  border-top:1px solid var(--border);
  display:flex;
  gap:10px;
  background:#fff;
}

.drawer-footer .btn{
  flex:1;
}

/* ===============================
   BOTTOM NAV
================================ */

.bottom-nav{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:16px;
  width:min(600px,calc(100% - 24px));
  height:64px;
  background:rgba(255,255,255,.96);
  border:1px solid var(--border);
  border-radius:20px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:3000;
  box-shadow:0 10px 30px rgba(25,25,60,.12);
  backdrop-filter:blur(15px);
}

.bottom-nav a{
  text-decoration:none;
  color:var(--muted);
  min-width:70px;
  height:50px;
  padding:7px 10px;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:11px;
  font-weight:600;
  transition:.2s;
}

.bottom-nav a i{
  font-size:17px;
}

.bottom-nav a:hover,
.bottom-nav a.active{
  color:var(--primary);
  background:var(--primary-soft);
}

.bottom-nav .logout{
  color:var(--danger);
}

.bottom-nav .logout:hover{
  background:var(--danger-soft);
}

/* ===============================
   MOBILE
================================ */

@media(max-width:700px){

  .top-nav{
    padding:0 18px;
    height:64px;
  }

  .brand{
    font-size:19px;
  }

  .brand-logo{
    width:36px;
    height:36px;
  }

  .page-content{
    padding:85px 14px 30px;
  }

  .title-area h1{
    font-size:24px;
  }

  .dashboard-header{
    align-items:flex-start;
  }

  .toolbar{
    padding:12px;
  }

  .toolbar .btn{
    flex:1;
    min-width:135px;
  }

  .toolbar-spacer{
    display:none;
  }

  .select-wrap{
    width:100%;
  }

  .select-input{
    width:100%;
  }

  .question-card{
    padding:16px;
    align-items:flex-start;
    flex-wrap:wrap;
  }

  .question-number{
    width:38px;
    height:38px;
  }

  .question-main{
    flex:1 1 calc(100% - 80px);
  }

  .question-actions{
    width:100%;
    justify-content:flex-end;
    margin-top:4px;
  }

  .options-grid{
    grid-template-columns:1fr;
  }

  .bottom-nav{
    bottom:8px;
    width:calc(100% - 16px);
  }

  .bottom-nav a{
    min-width:auto;
    flex:1;
  }

  .bottom-nav a span{
    font-size:10px;
  }
}
</style>

</head>

</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabaseUrl =
'https://ncc.missioncadetupgrade.workers.dev';

const supabaseKey =
'sb_publishable_VA-TOQxa5NucY7L1hPStkg_3eAj42PM';

const supabase1 =
supabase.createClient(
  supabaseUrl,
  supabaseKey
);


/* ===============================
   AUTHENTICATION
================================ */

const facultyEmail =
sessionStorage.getItem("email");

const role =
sessionStorage.getItem("role");

if(!facultyEmail || role !== "Faculty"){
  window.location.href = "index.html";
}


/* ===============================
   GLOBAL VARIABLES
================================ */

let questions = [];
let selectedIds = [];
let currentYear = "";


/* ===============================
   FETCH QUESTIONS
================================ */

async function fetchData(){

  document.getElementById("list").innerHTML = `
    <div class="loading">
      <i class="fas fa-circle-notch fa-spin"></i>
      <p>Loading questions...</p>
    </div>
  `;

  let query =
  supabase1
    .from('Questions')
    .select('*')
    .eq('FacultyEmail', facultyEmail);

  if(currentYear){
    query = query.eq('Year', currentYear);
  }

  const {data,error} =
  await query.order('created_at',{
    ascending:false
  });

  if(error){

    console.error(error);

    document.getElementById("list").innerHTML = `
      <div class="empty-state">
        <i class="fas fa-triangle-exclamation"></i>
        <h3>Unable to load questions</h3>
        <p>Please refresh the page and try again.</p>
      </div>
    `;

    return;
  }

  questions = data || [];
  selectedIds = [];

  render();

}


/* ===============================
   RENDER
================================ */

function render(){

  const list =
  document.getElementById("list");

  const count =
  document.getElementById("questionCount");

  count.innerHTML = `
    <i class="fas fa-layer-group"></i>
    ${questions.length} Question${questions.length !== 1 ? 's' : ''}
  `;


  if(questions.length === 0){

    list.innerHTML = `
      <div class="empty-state">

        <i class="fas fa-circle-question"></i>

        <h3>No Questions Found</h3>

        <p>
          Start building your examination question bank.
        </p>

        <br>

        <button
          class="btn btn-primary"
          onclick="openDrawerNew()"
        >
          <i class="fas fa-plus"></i>
          Add Your First Question
        </button>

      </div>
    `;

    return;
  }


  list.innerHTML = "";


  questions.forEach((q,index)=>{

    const yearText = getYearText(q.Year);

    list.innerHTML += `

      <article class="question-card">

        <input
          type="checkbox"
          class="question-check"
          onchange="toggleSelect('${q.id}',this)"
          title="Select question"
        >


        <div class="question-number">
          ${index + 1}
        </div>


        <div class="question-main">

          <div class="question-top">

            <span class="year-badge">
              ${yearText}
            </span>

            <span class="answer-badge">
              <i class="fas fa-check"></i>
              ${q.Answer || 'No Answer'}
            </span>

          </div>


          <div class="question-text">
            ${escapeHTML(q.Question || '')}
          </div>

        </div>


        <div class="question-actions">

          <button
            class="action-icon"
            onclick="edit('${q.id}')"
            title="Edit Question"
          >
            <i class="fas fa-pen"></i>
          </button>


          <button
            class="action-icon delete"
            onclick="del('${q.id}')"
            title="Delete Question"
          >
            <i class="fas fa-trash"></i>
          </button>

        </div>

      </article>

    `;

  });

}

/* ===============================
   SAVE
================================ */

async function save(){

  const id =
  document.getElementById("d_id").value;


  const payload = {

    FacultyEmail: facultyEmail,

    Year:
    document.getElementById("d_year").value,

    Question:
    document.getElementById("d_question").value.trim(),

    Option1:
    document.getElementById("d_option1").value.trim(),

    Option2:
    document.getElementById("d_option2").value.trim(),

    Option3:
    document.getElementById("d_option3").value.trim(),

    Option4:
    document.getElementById("d_option4").value.trim(),

    Answer:
    document.getElementById("d_answer").value

  };


  if(
    !payload.Year ||
    !payload.Question ||
    !payload.Option1 ||
    !payload.Option2 ||
    !payload.Option3 ||
    !payload.Option4 ||
    !payload.Answer
  ){

    alert(
      "Please complete all question details."
    );

    return;

  }


  let error;


  if(id){

    const response =
    await supabase1
      .from('Questions')
      .update(payload)
      .eq('id',id);

    error = response.error;

  }
  else{

    const response =
    await supabase1
      .from('Questions')
      .insert([payload]);

    error = response.error;

  }


  if(error){

    console.error(error);

    alert(
      "Unable to save question: " +
      error.message
    );

    return;

  }


  alert(
    id
    ? "Question updated successfully."
    : "Question added successfully."
  );

  closeDrawer();

  fetchData();

}

================================ */

async function del(id){

  if(
    !confirm(
      "Are you sure you want to delete this question?"
    )
  ){

  }


  const {error} =
  await supabase1
    .from('Questions')
    .delete()
    .eq('id',id);


  if(error){

    alert(
      "Unable to delete question."
    );

    return;

  }


  fetchData();

}


/* ===============================
   SELECT QUESTION
================================ */

function toggleSelect(id,el){

  if(el.checked){

    if(!selectedIds.includes(id)){

      selectedIds.push(id);

    }

  }
  else{

    selectedIds =
    selectedIds.filter(
      x => x !== id
    );

  }

}


/* ===============================
   BULK DELETE
================================ */

async function bulkDelete(){

  if(selectedIds.length === 0){

    alert(
      "Please select at least one question."
    );

    return;

  }


  if(
    !confirm(
      `Delete ${selectedIds.length} selected question(s)?`
    )
  ){
    return;
  }


  const {error} =
  await supabase1
    .from('Questions')
    .delete()
    .in('id',selectedIds);


  if(error){

    console.error(error);

    alert(
      "Unable to delete selected questions."
    );

    return;

  }


  selectedIds = [];

  fetchData();

}

/* ===============================
   UPLOAD EXCEL
================================ */

async function uploadExcel(event){

  const file =
  event.target.files[0];

  if(!file) return;


  try{

    const arrayBuffer =
    await file.arrayBuffer();

    const workbook =
    XLSX.read(arrayBuffer);


    const sheet =
    workbook.Sheets[
      workbook.SheetNames[0]
    ];


    const rows =
    XLSX.utils.sheet_to_json(
      sheet,
      {header:1}
    );


    rows.shift();


    let payload = [];


    rows.forEach(r => {

      if(
        r[0] &&
        r[1] &&
        r[2] &&
        r[3] &&
        r[4] &&
        r[5] &&
        r[7]
      ){

        payload.push({

          FacultyEmail:
          facultyEmail,

          Year:
          String(r[0]),

          Question:
          String(r[1]),

          Option1:
          String(r[2]),

          Option2:
          String(r[3]),

          Option3:
          String(r[4]),

          Option4:
          String(r[5]),

          Answer:
          String(r[7])

        });

      }

    });


    if(payload.length === 0){

      alert(
        "No valid questions found in the Excel file."
      );

      return;

    }


    const {error} =
    await supabase1
      .from('Questions')
      .insert(payload);


    if(error){

      throw error;

    }


    alert(
      `${payload.length} question(s) uploaded successfully.`
    );


    fetchData();


  }
  catch(error){

    console.error(error);

    alert(
      "Excel upload failed: " +
      error.message
    );

  }
  finally{

    event.target.value = "";

  }

}
